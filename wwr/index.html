<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | White Water Rafting</title>
    <meta name="description" content="Experience exciting whitewater rafting adventures on fast-flowing rivers with guided outdoor recreation trips for all skill levels.">
    <meta name="author" content="Esau Scott Lopez">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <a href="index.html">
            <img src="images/logo.png" alt="White Water Rafting">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/collage5.jpg" alt="">
            <h2>White Water Rafting</h2>
        </div>

        <div class="newsletter-box">
            <h2>Sign up for our newsletter to receive the latest updates, special offers, new trips and more!</h2>
                <div class="newsletter-form">
                    <form>
                        <div class="news-name">
                            <label for="name">Name:</label>                        
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div class="news-email">
                            <label for="useremail">Email:</label>
                            <input type="email" id="useremail" name="useremail" required>
                        </div>
                        <button type="submit">Get Updates!</button>
                    </form>
                </div>
        </div>

        <div class="our-trips">
            
            <img src="images/collage7.jpg" alt="Rapids">
            <div class="trip-call">
                <h2>Our Trips</h2>
                <p>From beginner floats to expert rapids, we have an adventure for everyone.</p>
                <a href="trips.html">View All Trips</a>
            </div>
            <img src="images/collage11.jpg" alt="Family Rafting">
        </div>

    </main>
    
    <footer>
        <p>©2026 White Water Rafting | Esau Scott Lopez</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>
</html>
