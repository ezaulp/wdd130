<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description" content="Whitewater Rafting Company, we are here to serve you as you need. Please contact us for any questions. ">
    <meta name="author" content="Esau Scott Lopez">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <a href="index.html">
            <img src="images/logo.png" alt="White Water Rafting">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="company-name">
            <h1>White Water Rafting Company</h1>
        </div>
        <div class="address">
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </div>
        <div class="contact-box">
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d3075.9886048485077!2d-107.3561367!3d39.5598645!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8741096248b0b099%3A0x6835dde86c877c52!2sWhitewater%20Rafting%2C%20LLC!5e0!3m2!1sen!2smx!4v1781047377278!5m2!1sen!2smx" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            
            <div class="contact-form">
                <form>

                    <div class="form-item information">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-item information">
                        <label for="useremail">Email:</label>
                        <input type="email" id="useremail" name="useremail" required>
                    </div>

                    <div class="form-item information">
                        <label>Message Purpose</label>
                        
                        <div class="purpose">
                            <input type="radio" id="inquiry" name="purpose">
                            <label for="inquiry">General Inquiry</label>

                            <input type="radio" id="reservation" name="purpose">
                            <label for="reservation">Reservation Question</label>

                            <input type="radio" id="suggestion" name="purpose">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </div>

                    <div class="form-item information">
                        <label for="feedback">Message</label>
                        <textarea id="feedback" name="feedback" rows="4" placeholder="Type here"></textarea>
                    </div>

                     <div class="form-item information">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                    </div>
                    
                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </div>

          <section>
            <h2>We Are Here to Serve You</h2>
            <div class="employees">
                <figure>
                    <img src="images/employee1.jpg" alt="Staff Member">
                    <figcaption>Staff Member</figcaption>
                </figure>
                <figure>
                    <img src="images/emoloyee2.jpg" alt="Safety Instructor">
                    <figcaption>Safety Instructor</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Guide">
                    <figcaption>Guide</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©2026 White Water Rafting | Esau Scott Lopez</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>
</html>
